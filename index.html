<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A.S.M Agencies - Nippon Paint Channel Partner. Shade cards, colour palette and contact." />
  <meta name="theme-color" content="#0f2747" />
  <title>A.S.M Agencies | Nippon Paint Channel Partner</title>
  <style>
    :root {
      --navy: #0f2747;
      --navy-2: #1b3a63;
      --gold: #d4a33a;
      --ink: #1d2733;
      --muted: #5b6675;
      --bg: #f4f6f9;
      --card: #ffffff;
      --line: #e3e8ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ---------- Header ---------- */
    .header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #fff;
      text-align: center;
      padding: 20px 20px 16px;
      position: relative;
    }
    .header::after {
      content: "";
      display: block;
      width: 48px;
      height: 3px;
      background: var(--gold);
      margin: 10px auto 0;
      border-radius: 2px;
    }
    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .tagline {
      margin-top: 4px;
      font-size: 13px;
      color: #cfd9e8;
      letter-spacing: 0.4px;
    }

    /* ---------- Main ---------- */
    .main {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 26px 18px 10px;
    }
    .intro {
      text-align: center;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(15, 39, 71, 0.06);
      padding: 16px 18px;
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: #eaf0f8;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--navy);
    }
    .card-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-height: 46px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 4px 10px rgba(15, 39, 71, 0.2);
    }
    .btn-outline {
      background: #fff;
      color: var(--navy);
      border: 1.5px solid var(--navy);
    }

    .btn-full {
      width: 100%;
      background: var(--gold);
      color: #1d1500;
      box-shadow: 0 4px 12px rgba(212, 163, 58, 0.35);
      min-height: 52px;
      font-size: 16px;
    }

    /* ---------- Paired row (Palette + Ideas) ---------- */
    .pair-row {
      display: flex;
      gap: 14px;
    }
    .pair-row .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      text-align: center;
    }
    .pair-row .icon {
      margin: 0 auto 8px;
    }
    .pair-row .card-title {
      font-size: 14px;
    }
    .pair-row .btn {
      margin-top: 10px;
      width: 100%;
    }

    /* ---------- Colour Ideas gallery ---------- */
    .gallery {
      display: none;
      margin-top: 14px;
    }
    .gallery.open { display: block; }
    .gallery-frame {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
    }
    .gallery-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
    .gallery-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .gallery-nav button {
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
    }
    .gallery-dots {
      display: flex;
      gap: 6px;
    }
    .gallery-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line);
      display: inline-block;
    }
    .gallery-dots span.active { background: var(--navy); }

    /* ---------- Footer ---------- */
    .footer {
      background: var(--navy);
      color: #cfd9e8;
      text-align: center;
      padding: 16px 20px 18px;
      margin-top: 18px;
    }
    .footer-name {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .footer-role {
      font-size: 13px;
      color: var(--gold);
      margin-top: 2px;
    }
    .footer-phone {
      display: inline-block;
      margin-top: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 6px 16px;
      border-radius: 999px;
    }
    .powered {
      margin-top: 12px;
      font-size: 11px;
      color: #8fa3bf;
      letter-spacing: 0.3px;
    }
  </style>
</head>

    /* ---------- Builders (each one is independent) ---------- */
    function createShadeCard(title, subtitle, icon, url) {
      const card = document.createElement("div");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      head.innerHTML =
        '<div class="icon">' + icon + '</div>' +
        '<div><div class="card-title"></div><div class="card-sub"></div></div>';
      head.querySelector(".card-title").textContent = title;
      head.querySelector(".card-sub").textContent = subtitle;

      const row = document.createElement("div");
      row.className = "btn-row";
      row.appendChild(createLink("View", url, "btn btn-outline", false));
      row.appendChild(createLink("Download", url, "btn btn-primary", true));

      card.appendChild(head);
      card.appendChild(row);
      return card;
    }

    function createLink(label, url, className, isDownload) {
      const a = document.createElement("a");
      a.textContent = label;
      a.href = url;
      a.className = className;
      a.target = "_blank";
      a.rel = "noopener";
      if (isDownload) a.setAttribute("download", "");
      return a;
    }

    function createGoogleButton(url) {
      const a = createLink("Visit A.S.M Agencies on Google", url, "btn btn-full", false);
      return a;
    }

    /* ---------- Colour Palette + Colour Ideas paired row ---------- */
    function createPaletteIdeasRow(paletteUrl, images) {
      const row = document.createElement("div");
      row.className = "pair-row";

      // Colour Palette mini-card
      const paletteCard = document.createElement("div");
      paletteCard.className = "card";
      paletteCard.innerHTML = '<div class="icon">🖌️</div><div class="card-title">Colour Palette</div>';
      const paletteBtn = createLink("Open", paletteUrl, "btn btn-outline", false);
      paletteCard.appendChild(paletteBtn);

      // Colour Ideas mini-card
      const ideasCard = document.createElement("div");
      ideasCard.className = "card";
      ideasCard.innerHTML = '<div class="icon">💡</div><div class="card-title">Colour Ideas</div>';
      const ideasBtn = document.createElement("button");
      ideasBtn.textContent = "View";
      ideasBtn.className = "btn btn-outline";
      ideasCard.appendChild(ideasBtn);

      row.appendChild(paletteCard);
      row.appendChild(ideasCard);

      const gallery = createColourIdeasGallery(images);
      ideasBtn.addEventListener("click", function () {
        gallery.classList.toggle("open");
        ideasBtn.textContent = gallery.classList.contains("open") ? "Hide" : "View";
      });

      const wrap = document.createElement("div");
      wrap.appendChild(row);
      wrap.appendChild(gallery);
      return wrap;
    }

    function createColourIdeasGallery(images) {
      let current = 0;
      const gallery = document.createElement("div");
      gallery.className = "gallery";

      const frame = document.createElement("div");
      frame.className = "gallery-frame";
      const img = document.createElement("img");
      img.src = images[0];
      img.alt = "Colour idea";
      frame.appendChild(img);

      const nav = document.createElement("div");
      nav.className = "gallery-nav";
      const prevBtn = document.createElement("button");
      prevBtn.textContent = "‹ Prev";
      const dots = document.createElement("div");
      dots.className = "gallery-dots";
      images.forEach(function () {
        const d = document.createElement("span");
        dots.appendChild(d);
      });
      const nextBtn = document.createElement("button");
      nextBtn.textContent = "Next ›";
      nav.appendChild(prevBtn);
      nav.appendChild(dots);
      nav.appendChild(nextBtn);

      function update() {
        img.src = images[current];
        Array.from(dots.children).forEach(function (d, i) {
          d.className = i === current ? "active" : "";
        });
      }
      prevBtn.addEventListener("click", function () {
        current = (current - 1 + images.length) % images.length;
        update();
      });
      nextBtn.addEventListener("click", function () {
        current = (current + 1) % images.length;
        update();
      });
      update();

      gallery.appendChild(frame);
      gallery.appendChild(nav);
      return gallery;
    }

    /* ---------- Render ---------- */
    function renderButtons() {
      const list = document.getElementById("buttonList");
      list.appendChild(createShadeCard("Interior Shade Card", "Interior colour range 2026", "🏠", LINKS.interior));
      list.appendChild(createShadeCard("Exterior Shade Card", "Exterior colour range 2026", "🏢", LINKS.exterior));
      list.appendChild(createShadeCard("Enamel Shade Card", "Enamel colour range 2026", "🎨", LINKS.enamel));
      list.appendChild(createPaletteIdeasRow(LINKS.palette, COLOUR_IDEAS_IMAGES));
      list.appendChild(createGoogleButton(LINKS.google));
    }

    renderButtons();
  </script>

</body>
