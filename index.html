<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Digital Business Card Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-grow flex flex-col justify-between">
        <!-- Dynamic content injected via JavaScript -->
    </div>

    <!-- LIVE SMARTPHONE PREVIEW MODAL -->
    <div id="preview-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full shadow-2xl flex flex-col overflow-hidden my-auto max-h-[90vh]">
            <!-- Modal Header Bar -->
            <div class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider">Live Smartphone Preview</h3>
                </div>
                <div class="flex items-center gap-2">
                    <button id="preview-external-link" target="_blank" class="text-xs text-brand-400 hover:text-brand-300 font-semibold flex items-center gap-1 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> New Tab
                    </button>
                    <button onclick="closeLivePreviewModal()" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-full flex items-center justify-center transition">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            </div>
            
            <!-- Smartphone Display Frame -->
            <div id="preview-modal-content" class="overflow-y-auto flex-grow p-4 bg-slate-950">
                <!-- Customer card injected dynamically -->
            </div>
        </div>
    </div>

    <!-- QR CODE MODAL -->
    <div id="qr-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl flex flex-col items-center text-center">
            <h3 class="text-xl font-bold text-white mb-1" id="qr-modal-title">NFC Profile QR Code</h3>
            <p class="text-xs text-slate-400 mb-4" id="qr-modal-subtitle">Scan to open digital contact profile</p>
            <div id="qrcode-container" class="bg-white p-4 rounded-xl shadow-inner mb-4 flex justify-center items-center"></div>
            <div class="w-full bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 text-xs text-slate-300 font-mono break-all mb-5 select-all" id="qr-modal-url"></div>
            <div class="flex gap-2 w-full">
                <button onclick="copyModalUrl()" class="flex-1 py-2 px-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i> Copy Link
                </button>
                <button onclick="closeQrModal()" class="py-2 px-4 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-sm font-semibold transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- CONFIRMATION DIALOG MODAL -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl text-center">
            <div class="w-12 h-12 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2" id="confirm-title">Are you sure?</h3>
            <p class="text-sm text-slate-300 mb-6" id="confirm-message">This action cannot be undone.</p>
            <div class="flex gap-3 justify-center">
                <button id="confirm-cancel-btn" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-sm font-medium transition">Cancel</button>
                <button id="confirm-ok-btn" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-red-600/30">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // Seed initial customer profile data if empty
        const SEED_DATA = [
            {
                id: 'customer1',
                name: 'Alexander Pierce',
                company: 'Apex Technologies Inc. - Global Software Engineering & Enterprise Solutions',
                title: 'Chief Technology Officer',
                mobile1: '+1 (555) 234-5678',
                mobile2: '+1 (555) 876-5432',
                landline: '+1 (555) 400-1122',
                addr1: 'Suite 400, Innovation Tower',
                addr2: '100 Cybernetic Boulevard',
                addr3: 'Tech District',
                addr4: 'San Francisco, CA 94105',
                addr5: 'United States',
                email: 'alex.pierce@apextech.io',
                location: 'https://maps.google.com/?q=San+Francisco+CA',
                note: 'Available for executive meetings on weekdays 9 AM - 5 PM EST. Preferred contact via email for inquiries.',
                photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80',
                showBranding: true
            },
            {
                id: 'customer2',
                name: 'Sophia Martinez',
                company: 'Vanguard Global Mobility Services & Corporate Consulting Partnership',
                title: 'Head of Strategic Partnerships',
                mobile1: '+44 20 7946 0912',
                mobile2: '+44 77 0090 0143',
                landline: '+44 20 7946 0000',
                addr1: 'Floor 12, Vanguard Heights',
                addr2: '25 Financial Square',
                addr3: 'Canary Wharf',
                addr4: 'London E14 5AB',
                addr5: 'United Kingdom',
                email: 's.martinez@vanguardglobal.com',
                location: 'https://maps.google.com/?q=Canary+Wharf+London',
                note: 'Global mobility solutions and enterprise corporate relations.',
                photo: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400&auto=format&fit=crop&q=80',
                showBranding: true
            }
        ];

        // Ensures stored profiles structure compatibility
        function sanitizeProfile(p) {
            if (!p || typeof p !== 'object') return null;
            return {
                id: p.id || 'profile_' + Date.now(),
                name: p.name || '',
                company: p.company || '',
                title: p.title || '',
                mobile1: p.mobile1 || '',
                mobile2: p.mobile2 || '',
                landline: p.landline || '',
                addr1: p.addr1 || '',
                addr2: p.addr2 || '',
                addr3: p.addr3 || '',
                addr4: p.addr4 || '',
                addr5: p.addr5 || '',
                email: p.email || '',
                location: p.location || '',
                note: p.note || '',
                photo: p.photo || '',
                showBranding: p.showBranding !== undefined ? Boolean(p.showBranding) : true
            };
        }

        function getStoredProfiles() {
            try {
                const data = localStorage.getItem('nfc_card');
                if (data === null) {
                    localStorage.setItem('nfc_card', JSON.stringify(SEED_DATA));
                    return SEED_DATA.map(sanitizeProfile);
                }
                const parsed = JSON.parse(data);
                if (Array.isArray(parsed)) {
                    return parsed.map(sanitizeProfile).filter(Boolean);
                }
                return [];
            } catch (e) {
                console.error('Error reading nfc_card from localStorage', e);
                return [];
            }
        }

        function saveProfiles(profiles) {
            const sanitized = profiles.map(sanitizeProfile).filter(Boolean);
            localStorage.setItem('nfc_card', JSON.stringify(sanitized));
        }

        function getBaseUrl() {
            const customBase = localStorage.getItem('nfc_custom_base_url');
            if (customBase && customBase.trim() !== '') {
                return customBase.trim();
            }
            if (window.location.protocol === 'file:') {
                return 'https://asm-cdm.github.io/nfc_digital_card_engine/';
            }
            return window.location.origin + window.location.pathname;
        }

        function saveBaseUrl(url) {
            if (url) {
                localStorage.setItem('nfc_custom_base_url', url);
            } else {
                localStorage.removeItem('nfc_custom_base_url');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-brand-600';
            const iconClass = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <div class="flex items-center gap-2.5 text-sm font-medium">
                    <i class="fa-solid ${iconClass}"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function confirmAction(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            modal.classList.remove('hidden');
            
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            const okBtn = document.getElementById('confirm-ok-btn');
            
            const cleanup = () => {
                modal.classList.add('hidden');
                cancelBtn.onclick = null;
                okBtn.onclick = null;
            };
            
            cancelBtn.onclick = cleanup;
            okBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
        }

        function downloadVCard(profileOrId) {
            let profile = profileOrId;
            if (typeof profileOrId === 'string') {
                profile = getStoredProfiles().find(p => p.id === profileOrId);
            }
            if (!profile) return;

            const vcardContent = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `FN:${profile.name || ''}`,
                `N:${(profile.name || '').split(' ').reverse().join(';')};;;`,
                `ORG:${profile.company || ''}`,
                `TITLE:${profile.title || ''}`,
                profile.mobile1 ? `TEL;TYPE=CELL,VOICE:${profile.mobile1}` : '',
                profile.mobile2 ? `TEL;TYPE=CELL,VOICE:${profile.mobile2}` : '',
                profile.landline ? `TEL;TYPE=WORK,VOICE:${profile.landline}` : '',
                profile.email ? `EMAIL;TYPE=WORK:${profile.email}` : '',
                `ADR;TYPE=WORK:;;${profile.addr1 || ''}\\n${profile.addr2 || ''}\\n${profile.addr3 || ''};${profile.addr4 || ''};;${profile.addr5 || ''};`,
                profile.location ? `URL;TYPE=LOCATION:${profile.location}` : '',
                profile.note ? `NOTE:${profile.note.replace(/\n/g, '\\n')}` : '',
                'END:VCARD'
            ].filter(Boolean).join('\r\n');

            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isAndroid = /Android/i.test(navigator.userAgent);

            if (isIOS) {
                // iOS Safari opens native contact sheet overlay
                const encodedVCard = encodeURIComponent(vcardContent);
                window.location.href = `data:text/vcard;charset=utf-8,${encodedVCard}`;
                showToast('Opening iOS Contact Sheet...', 'success');
            } else if (isAndroid) {
                // Android downloads .vcf -> User taps 'Open' notification to import directly into Contacts app
                const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', `${(profile.name || 'contact').toLowerCase().replace(/\s+/g, '_')}.vcf`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Downloaded! Tap "Open" on notification to save to Contacts.', 'success');
            } else {
                // Desktop browser fallback download
                const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', `${(profile.name || 'contact').toLowerCase().replace(/\s+/g, '_')}.vcf`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('vCard generated & downloaded!', 'success');
            }
        }

        function generateProfileCardHtml(profileRaw) {
            const profile = sanitizeProfile(profileRaw);
            if (!profile) return '<div class="text-center py-6 text-red-400">Invalid Profile Data</div>';

            const avatarUrl = profile.photo && profile.photo.trim() !== '' 
                ? profile.photo 
                : `https://placehold.co/200x200/1e293b/64748b?text=${encodeURIComponent(profile.name ? profile.name.charAt(0) : 'C')}`;

            // Combine non-empty address lines into continuous paragraph format
            const addressLines = [profile.addr1, profile.addr2, profile.addr3, profile.addr4, profile.addr5]
                .filter(line => line && line.trim() !== '');

            return `
                <div class="bg-slate-900/90 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden backdrop-blur-xl relative">
                    <!-- Header Banner -->
                    <div class="h-28 bg-gradient-to-r from-brand-700 via-brand-600 to-indigo-600 relative">
                        <div class="absolute inset-0 bg-black/10"></div>
                    </div>

                    <!-- Avatar / Logo & Core Info -->
                    <div class="px-5 pb-5 pt-0 relative flex flex-col items-center text-center">
                        <div class="-mt-14 mb-3 relative">
                            <img src="${avatarUrl}" onerror="this.src='https://placehold.co/200x200/1e293b/64748b?text=User'" alt="${profile.name}" class="w-24 h-24 rounded-full object-cover border-4 border-slate-900 shadow-xl bg-slate-800">
                            <div class="absolute bottom-0.5 right-0.5 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full flex items-center justify-center text-white text-[9px]" title="NFC Profile Verified">
                                <i class="fa-solid fa-check"></i>
                            </div>
                        </div>

                        <!-- Name -->
                        <h1 class="text-xl font-bold text-white tracking-tight">${profile.name || 'Unnamed Contact'}</h1>
                        ${profile.title ? `<p class="text-brand-400 font-medium text-xs mt-0.5">${profile.title}</p>` : ''}
                        
                        <!-- Company Name (Paragraph style, max 2 lines) -->
                        ${profile.company ? `
                            <p class="text-slate-300 text-xs mt-2.5 max-w-xs font-medium leading-relaxed line-clamp-2 text-center bg-slate-950/70 py-2 px-3.5 rounded-xl border border-slate-800/80 shadow-inner">
                                ${profile.company}
                            </p>
                        ` : ''}

                        <!-- Download vCard CTA Button -->
                        <button onclick="downloadVCard('${profile.id}')" 
                                class="mt-4 w-full py-3 px-4 bg-brand-600 hover:bg-brand-500 active:scale-[0.99] text-white rounded-2xl font-semibold text-xs shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 transition duration-200">
                            <i class="fa-solid fa-address-card text-sm"></i> Save Contact to Phone
                        </button>

                        <!-- Quick Contact Call Buttons (Mobile 1, Mobile 2, Landline) -->
                        <div class="flex flex-wrap gap-2 w-full mt-3 justify-center">
                            ${profile.mobile1 ? `
                                <a href="tel:${profile.mobile1.replace(/\s+/g, '')}" class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 py-2 px-2.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-[11px] font-semibold text-slate-200 transition">
                                    <i class="fa-solid fa-phone text-emerald-400"></i> Mobile 1
                                </a>
                            ` : ''}
                            ${profile.mobile2 ? `
                                <a href="tel:${profile.mobile2.replace(/\s+/g, '')}" class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 py-2 px-2.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-[11px] font-semibold text-slate-200 transition">
                                    <i class="fa-solid fa-mobile-screen text-emerald-400"></i> Mobile 2
                                </a>
                            ` : ''}
                            ${profile.landline ? `
                                <a href="tel:${profile.landline.replace(/\s+/g, '')}" class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 py-2 px-2.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-[11px] font-semibold text-slate-200 transition">
                                    <i class="fa-solid fa-phone-office text-blue-400"></i> Landline
                                </a>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Detailed Information List (ORDER: Phone Numbers -> Landline -> Office Address -> Email Address -> Location -> Remarks) -->
                    <div class="border-t border-slate-800/80 px-5 py-4 flex flex-col gap-3.5 text-left">
                        
                        <!-- 1. Contact Numbers (Mobile 1, Mobile 2, Landline) -->
                        ${profile.mobile1 || profile.mobile2 || profile.landline ? `
                            <div class="flex items-start gap-3">
                                <div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700/50 flex items-center justify-center text-emerald-400 flex-shrink-0 mt-0.5 shadow-sm text-xs">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <div class="flex-grow">
                                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Contact Numbers</p>
                                    ${profile.mobile1 ? `<p class="text-xs font-medium text-slate-200">${profile.mobile1} <span class="text-[10px] text-slate-500">(Primary Mobile)</span></p>` : ''}
                                    ${profile.mobile2 ? `<p class="text-xs font-medium text-slate-200">${profile.mobile2} <span class="text-[10px] text-slate-500">(Secondary Mobile)</span></p>` : ''}
                                    ${profile.landline ? `<p class="text-xs font-medium text-slate-200">${profile.landline} <span class="text-[10px] text-slate-500">(Landline / Office)</span></p>` : ''}
                                </div>
                            </div>
                        ` : ''}

                        <!-- 2. Office Address (Merged Continuous Paragraph Block) -->
                        ${addressLines.length > 0 ? `
                            <div class="flex items-start gap-3">
                                <div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700/50 flex items-center justify-center text-amber-400 flex-shrink-0 mt-0.5 shadow-sm text-xs">
                                    <i class="fa-solid fa-location-dot"></i>
                                </div>
                                <div class="flex-grow">
                                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Office Address</p>
                                    <p class="text-xs font-medium text-slate-200 leading-relaxed bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 shadow-inner">
                                        ${addressLines.join(', ')}
                                    </p>
                                </div>
                            </div>
                        ` : ''}

                        <!-- 3. Email Address (Placed AFTER Office Address) -->
                        ${profile.email ? `
                            <div class="flex items-start gap-3">
                                <div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700/50 flex items-center justify-center text-brand-400 flex-shrink-0 mt-0.5 shadow-sm text-xs">
                                    <i class="fa-regular fa-envelope"></i>
                                </div>
                                <div class="flex-grow min-w-0">
                                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Email Address</p>
                                    <a href="mailto:${profile.email}" class="text-xs font-medium text-slate-200 hover:text-brand-400 transition truncate block">
                                        ${profile.email}
                                    </a>
                                </div>
                            </div>
                        ` : ''}

                        <!-- 4. Location Map Link -->
                        ${profile.location ? `
                            <div class="mt-0.5">
                                <a href="${profile.location}" target="_blank" rel="noopener noreferrer" class="w-full py-2 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700/80 rounded-xl text-xs font-semibold text-brand-300 flex items-center justify-center gap-2 transition shadow-sm">
                                    <i class="fa-solid fa-map-location-dot"></i> Open Location in Google Maps / GPS
                                </a>
                            </div>
                        ` : ''}

                        <!-- 5. Remarks / Note -->
                        ${profile.note ? `
                            <div class="flex items-start gap-3 pt-2 border-t border-slate-800/50">
                                <div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700/50 flex items-center justify-center text-purple-400 flex-shrink-0 mt-0.5 shadow-sm text-xs">
                                    <i class="fa-regular fa-note-sticky"></i>
                                </div>
                                <div class="flex-grow">
                                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Remarks / Notes</p>
                                    <p class="text-xs text-slate-300 mt-1 whitespace-pre-line leading-relaxed bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">${profile.note}</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Tag ID & Conditional Powered By Footer Column -->
                    <div class="bg-slate-950/80 px-4 py-3 border-t border-slate-800/80 text-center flex flex-col items-center gap-1">
                        <div class="flex items-center gap-2 text-[11px] text-slate-500">
                            <span>Tag ID:</span>
                            <code class="bg-slate-900 px-2 py-0.5 rounded text-brand-400 font-mono text-[10px] border border-slate-800">${profile.id}</code>
                        </div>
                        ${profile.showBranding !== false ? `
                            <div class="text-[10px] text-slate-400/50 font-medium tracking-wide uppercase mt-1">
                                Powered by A.S.M Consultancy Services
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderCustomerProfile(profileId) {
            const profiles = getStoredProfiles();
            const profile = profiles.find(p => p.id === profileId);
            const app = document.getElementById('app');

            if (!profile) {
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div class="w-20 h-20 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center text-3xl mb-4 border border-red-500/20">

        function handleFormSubmit(e) {
            e.preventDefault();
            const originalId = document.getElementById('form-original-id').value;
            const newId = document.getElementById('form-id').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');

            if (!newId) {
                showToast('Please specify a valid Profile ID', 'error');
                return;
            }

            const profiles = getStoredProfiles();

            // Check if ID conflict exists when creating or changing slug
            if ((!originalId || originalId !== newId) && profiles.some(p => p.id === newId)) {
                showToast(`Profile ID "${newId}" already exists. Please pick a unique ID.`, 'error');
                return;
            }

            const profileData = sanitizeProfile({
                id: newId,
                name: document.getElementById('form-name').value.trim(),
                company: document.getElementById('form-company').value.trim(),
                title: document.getElementById('form-title').value.trim(),
                email: document.getElementById('form-email').value.trim(),
                mobile1: document.getElementById('form-mobile1').value.trim(),
                mobile2: document.getElementById('form-mobile2').value.trim(),
                landline: document.getElementById('form-landline').value.trim(),
                addr1: document.getElementById('form-addr1').value.trim(),
                addr2: document.getElementById('form-addr2').value.trim(),
                addr3: document.getElementById('form-addr3').value.trim(),
                addr4: document.getElementById('form-addr4').value.trim(),
                addr5: document.getElementById('form-addr5').value.trim(),
                location: document.getElementById('form-location').value.trim(),
                photo: document.getElementById('form-photo').value.trim(),
                note: document.getElementById('form-note').value.trim(),
                showBranding: document.getElementById('form-show-branding').checked
            });

            if (originalId) {
                const index = profiles.findIndex(p => p.id === originalId);
                if (index !== -1) profiles[index] = profileData;
                showToast('Profile updated successfully!', 'success');
            } else {
                profiles.unshift(profileData);
                showToast('New profile created successfully!', 'success');
            }

            saveProfiles(profiles);
            renderAdminDashboard();
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 3 * 1024 * 1024) {
                showToast('Image size should be under 3MB', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                document.getElementById('form-photo').value = base64Url;
                const preview = document.getElementById('photo-preview');
                if (preview) preview.src = base64Url;
                showToast('Photo/Logo processed successfully!', 'success');
            };
            reader.readAsDataURL(file);
        }

        function deleteProfile(id) {
            confirmAction('Delete Profile?', `Are you sure you want to delete profile "${id}"?`, () => {
                let profiles = getStoredProfiles();
                profiles = profiles.filter(p => p.id !== id);
                saveProfiles(profiles);
                showToast(`Profile "${id}" deleted.`, 'info');
                renderAdminDashboard();
            });
        }

        function exportData() {
            const profiles = getStoredProfiles();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(profiles, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `nfc_profiles_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Backup JSON downloaded!', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedProfiles = JSON.parse(e.target.result);
                    if (Array.isArray(importedProfiles)) {
                        saveProfiles(importedProfiles);
                        showToast(`Successfully restored ${importedProfiles.length} profiles!`, 'success');
                        renderAdminDashboard();
                    } else {
                        showToast('Invalid JSON file format.', 'error');
                    }
                } catch (err) {
                    showToast('Failed to parse JSON file.', 'error');
                }
            };
            reader.readAsText(file);
        }

        function triggerResetAll() {
            confirmAction(
                'Reset All Data?', 
                'This will completely remove ALL saved cards and reset the app to a clean, fresh state.', 
                () => {
                    localStorage.setItem('nfc_card', JSON.stringify([]));
                    showToast('All old data removed! App is now completely fresh.', 'success');
                    renderAdminDashboard();
                }
            );
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast('URL copied to clipboard!', 'success');
            } catch (err) {
                showToast('Failed to copy', 'error');
            }
            document.body.removeChild(tempInput);
        }

        function updateBaseDomain() {
            const input = document.getElementById('base-url-input');
            if (input) {
                let val = input.value.trim();
                if (val && !val.endsWith('/') && !val.includes('?')) {
                    val += '/';
                }
                saveBaseUrl(val);
                showToast('Base hosting URL updated!', 'success');
                renderAdminDashboard();
            }
        }

        let activeModalUrl = '';

        function openQrModal(id) {
            const profiles = getStoredProfiles();
            const profile = profiles.find(p => p.id === id);
            if (!profile) return;

            const origin = getBaseUrl();
            const url = `${origin}?id=${profile.id}`;

            activeModalUrl = url;
            document.getElementById('qr-modal-title').innerText = profile.name || 'NFC Profile';
            document.getElementById('qr-modal-subtitle').innerText = `Target NFC URL for tag: ${profile.id}`;
            document.getElementById('qr-modal-url').innerText = url;

            const container = document.getElementById('qrcode-container');
            container.innerHTML = '';
            
            new QRCode(container, {
                text: url,
                width: 180,
                height: 180,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qr-modal').classList.remove('hidden');
        }

        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function copyModalUrl() {
            if (activeModalUrl) copyToClipboard(activeModalUrl);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const customerId = urlParams.get('id');

            if (customerId) {
                renderCustomerProfile(customerId);
            } else {
                renderAdminDashboard();
            }
        });
    </script>
</body>
</html>
