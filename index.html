<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A.S.M Agencies - Nippon Paint Channel Partner. Shade cards, colour palette and contact." />
  <meta name="theme-color" content="#0f2747" />
  <title>A.S.M Agencies | Nippon Paint Channel Partner</title>
  <style>
    :root {
      --navy: #0f2747;
      --navy-2: #1b3a63;
      --gold: #d4a33a;
      --ink: #1d2733;
      --muted: #5b6675;
      --bg: #f4f6f9;
      --card: #ffffff;
      --line: #e3e8ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ---------- Header ---------- */
    .header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #fff;
      text-align: center;
      padding: 40px 20px 34px;
      position: relative;
    }
    .header::after {
      content: "";
      display: block;
      width: 56px;
      height: 3px;
      background: var(--gold);
      margin: 18px auto 0;
      border-radius: 2px;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #fff;
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    .brand {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .tagline {
      margin-top: 6px;
      font-size: 14px;
      color: #cfd9e8;
      letter-spacing: 0.4px;
    }

    /* ---------- Main ---------- */
    .main {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 26px 18px 10px;
    }
    .intro {
      text-align: center;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(15, 39, 71, 0.06);
      padding: 16px 18px;
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: #eaf0f8;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--navy);
    }
    .card-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-height: 46px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 4px 10px rgba(15, 39, 71, 0.2);
    }
    .btn-outline {
      background: #fff;
      color: var(--navy);
      border: 1.5px solid var(--navy);
    }

    .btn-full {
      width: 100%;
      background: var(--gold);
      color: #1d1500;
      box-shadow: 0 4px 12px rgba(212, 163, 58, 0.35);
      min-height: 52px;
      font-size: 16px;
    }

    /* ---------- Footer ---------- */
    .footer {
      background: var(--navy);
      color: #cfd9e8;
      text-align: center;
      padding: 26px 20px 30px;
      margin-top: 18px;
    }
    .footer-name {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .footer-role {
      font-size: 14px;
      color: var(--gold);
      margin-top: 4px;
    }
    .footer-phone {
      display: inline-block;
      margin-top: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 8px 18px;
      border-radius: 999px;
    }
    .powered {
      margin-top: 20px;
      font-size: 12px;
      color: #8fa3bf;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-badge">ASM</div>
    <h1 class="brand">A.S.M Agencies</h1>
    <p class="tagline">Nippon Paint Channel Partner</p>
  </header>

  <main class="main">
    <p class="intro">Choose a shade card or visit us.</p>
    <div id="buttonList" class="btn-list"></div>
  </main>

  <footer class="footer">
    <div class="footer-name">A.S.M Agencies</div>
    <div class="footer-role">Nippon Paint Channel Partner</div>
    <a id="phoneLink" class="footer-phone" href="tel:+919443262945">Contact: 94432 62945</a>
    <div class="powered">Powered by A.S.M Consultancy Services</div>
  </footer>

  <script>
    /* ---------- Configuration (edit links here) ---------- */
    const LINKS = {
      interior: "https://nipponpaint.co.in/wp-content/uploads/2026/03/Interior-Shade-Card-2026-Digital-ENG.pdf",
      exterior: "https://nipponpaint.co.in/wp-content/uploads/2026/03/Exterior-Shade-Card-2026-Digital-ENG.pdf",
      enamel:   "https://nipponpaint.co.in/wp-content/uploads/2026/03/Enamel-Shade-Card-2026-Digital-.pdf",
      palette:  "https://nipponpaint.co.in/colour-ranges/accents/",
      google:   "https://share.google/uUkQSXfHJXgUKYu7B"
    };

    /* ---------- Builders (each one is independent) ---------- */
    function createShadeCard(title, subtitle, icon, url) {
      const card = document.createElement("div");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      head.innerHTML =
        '<div class="icon">' + icon + '</div>' +
        '<div><div class="card-title"></div><div class="card-sub"></div></div>';
      head.querySelector(".card-title").textContent = title;
      head.querySelector(".card-sub").textContent = subtitle;

      const row = document.createElement("div");
      row.className = "btn-row";
      row.appendChild(createLink("View", url, "btn btn-outline", false));
      row.appendChild(createLink("Download", url, "btn btn-primary", true));

      card.appendChild(head);
      card.appendChild(row);
      return card;
    }

    function createLink(label, url, className, isDownload) {
      const a = document.createElement("a");
      a.textContent = label;
      a.href = url;
      a.className = className;
      a.target = "_blank";
      a.rel = "noopener";
      if (isDownload) a.setAttribute("download", "");
      return a;
    }

    function createSingleButton(label, url, icon) {
      const card = document.createElement("div");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      head.innerHTML = '<div class="icon">' + icon + '</div><div class="card-title"></div>';
      head.querySelector(".card-title").textContent = label;

      const a = createLink("Open", url, "btn btn-outline", false);
      a.style.width = "100%";

      card.appendChild(head);
      card.appendChild(a);
      return card;
    }

    function createGoogleButton(url) {
      const a = createLink("Visit A.S.M Agencies on Google", url, "btn btn-full", false);
      return a;
    }

    /* ---------- Render ---------- */
    function renderButtons() {
      const list = document.getElementById("buttonList");
      list.appendChild(createShadeCard("Interior Shade Card", "Interior colour range 2026", "🏠", LINKS.interior));
      list.appendChild(createShadeCard("Exterior Shade Card", "Exterior colour range 2026", "🏢", LINKS.exterior));
      list.appendChild(createShadeCard("Enamel Shade Card", "Enamel colour range 2026", "🎨", LINKS.enamel));
      list.appendChild(createSingleButton("Colour Palette", LINKS.palette, "🖌️"));
      list.appendChild(createGoogleButton(LINKS.google));
    }

    renderButtons();
  </script>

</body>
</html>
